services:
    postgres:
        image: 'postgres:16-alpine'
        container_name: students-postgres
        environment:
            POSTGRES_DB: students_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5433:5432'
        volumes:
            - 'postgres16_data:/var/lib/postgresql/data'
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U postgres -d students_db
            interval: 10s
            timeout: 5s
            retries: 5
    redis:
        image: 'redis:7-alpine'
        container_name: students-redis
        ports:
            - '6379:6379'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 10s
            timeout: 5s
            retries: 5
    zookeeper:
        image: 'confluentinc/cp-zookeeper:7.5.0'
        container_name: students-zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
        ports:
            - '2181:2181'
    kafka:
        image: 'confluentinc/cp-kafka:7.5.0'
        container_name: students-kafka
        depends_on:
            - zookeeper
        ports:
            - '9092:9092'
            - '29092:29092'
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    eureka-server:
        build:
            context: ./eureka-server
        container_name: students-eureka-server
        ports:
            - '8761:8761'
    etudiant-service:
        build:
            context: ./rest-spring-api
            dockerfile: Dockerfile
        container_name: students-etudiant-service
        environment:
            SERVER_PORT: 8081
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: students_db
            DB_USERNAME: postgres
            DB_PASSWORD: postgres
            REDIS_HOST: redis
            REDIS_PORT: 6379
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
            EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
            EUREKA_INSTANCE_HOSTNAME: etudiant-service
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            kafka:
                condition: service_started
            eureka-server:
                condition: service_started
        ports:
            - '8081:8081'
        healthcheck:
            test:
                - CMD
                - curl
                - -f
                - http://localhost:8081/actuator/health
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
    grading-service:
        build:
            context: ./grading-service
        container_name: students-grading-service
        environment:
            SERVER_PORT: 8082
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: students_db
            DB_USERNAME: postgres
            DB_PASSWORD: postgres
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
            EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
            EUREKA_INSTANCE_HOSTNAME: grading-service
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_started
            eureka-server:
                condition: service_started
        ports:
            - '8082:8082'
        healthcheck:
            test:
                - CMD
                - curl
                - -f
                - http://localhost:8082/actuator/health
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
    notification-service:
        build:
            context: ./notification-service
        container_name: students-notification-service
        environment:
            SERVER_PORT: 8083
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        depends_on:
            kafka:
                condition: service_started
        ports:
            - '8083:8083'
        healthcheck:
            test:
                - CMD
                - curl
                - -f
                - http://localhost:8083/actuator/health
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
    elasticsearch:
        image: 'docker.elastic.co/elasticsearch/elasticsearch:8.12.0'
        container_name: students-elasticsearch
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
        ports:
            - '9200:9200'
    logstash:
        image: 'docker.elastic.co/logstash/logstash:8.12.0'
        container_name: students-logstash
        ports:
            - '5000:5000'
            - '9600:9600'
        volumes:
            - './observability/logstash/pipeline:/usr/share/logstash/pipeline'
        depends_on:
            - elasticsearch
    kibana:
        image: 'docker.elastic.co/kibana/kibana:8.12.0'
        container_name: students-kibana
        ports:
            - '5601:5601'
        depends_on:
            - elasticsearch
    prometheus:
        image: 'prom/prometheus:latest'
        container_name: students-prometheus
        volumes:
            - './observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml'
        ports:
            - '9090:9090'
    grafana:
        image: 'grafana/grafana:latest'
        container_name: students-grafana
        ports:
            - '3002:3000'
        depends_on:
            - prometheus
    api-gateway:
        build:
            context: ./api-gateway
        container_name: students-api-gateway
        environment:
            SERVER_PORT: 8080
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
            EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
            EUREKA_INSTANCE_HOSTNAME: api-gateway
        depends_on:
            eureka-server:
                condition: service_started
        ports:
            - '8080:8080'
    mongodb:
        image: 'mongo:7-alpine'
        container_name: students-mongodb
        environment:
            MONGO_INITDB_ROOT_USERNAME: mongo
            MONGO_INITDB_ROOT_PASSWORD: mongo
            MONGO_INITDB_DATABASE: auth_db
        ports:
            - '27017:27017'
        volumes:
            - 'mongodb_data:/data/db'
        healthcheck:
            test:
                - CMD
                - mongosh
                - --eval
                - 'db.adminCommand("ping")'
            interval: 10s
            timeout: 5s
            retries: 5
    auth-service:
        build:
            context: ./auth-service
        container_name: students-auth-service
        environment:
            PORT: 3001
            MONGO_URI: mongodb://mongo:mongo@mongodb:27017/auth_db
            JWT_SECRET: your-secret-key-change-in-production
            NODE_ENV: production
        depends_on:
            mongodb:
                condition: service_healthy
        ports:
            - '3001:3001'
    frontend:
        build:
            context: ./frontend
        container_name: students-frontend
        environment:
            API_BASE_URL: http://api-gateway:8080
            NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        depends_on:
            api-gateway:
                condition: service_started
        ports:
            - '3000:3000'
volumes:
    postgres_data: null
    postgres16_data: null
    mongodb_data: null
