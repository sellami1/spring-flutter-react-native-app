services:
    postgres:
        image: 'postgres:16-alpine'
        container_name: students-postgres
        environment:
            POSTGRES_DB: students_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - '5433:5432'
        volumes:
            - 'postgres16_data:/var/lib/postgresql/data'
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U postgres -d students_db
            interval: 10s
            timeout: 5s
            retries: 5
    redis:
        image: 'redis:7-alpine'
        container_name: students-redis
        ports:
            - '6379:6379'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 10s
            timeout: 5s
            retries: 5
    eureka-server:
        build:
            context: ./eureka-server
        container_name: students-eureka-server
        ports:
            - '8761:8761'
    etudiant-service:
        build:
            context: ./rest-spring-api
            dockerfile: Dockerfile
        container_name: students-etudiant-service
        environment:
            SERVER_PORT: 8081
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: students_db
            DB_USERNAME: postgres
            DB_PASSWORD: postgres
            REDIS_HOST: redis
            REDIS_PORT: 6379
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
            EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
            EUREKA_INSTANCE_HOSTNAME: etudiant-service
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            eureka-server:
                condition: service_started
        ports:
            - '8081:8081'
    grading-service:
        build:
            context: ./grading-service
        container_name: students-grading-service
        environment:
            SERVER_PORT: 8082
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: students_db
            DB_USERNAME: postgres
            DB_PASSWORD: postgres
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
            EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
            EUREKA_INSTANCE_HOSTNAME: grading-service
        depends_on:
            postgres:
                condition: service_healthy
            eureka-server:
                condition: service_started
        ports:
            - '8082:8082'
    api-gateway:
        build:
            context: ./api-gateway
        container_name: students-api-gateway
        environment:
            SERVER_PORT: 8080
            EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
            EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
            EUREKA_INSTANCE_HOSTNAME: api-gateway
        depends_on:
            eureka-server:
                condition: service_started
        ports:
            - '8080:8080'
    mongodb:
        image: 'mongo:7-alpine'
        container_name: students-mongodb
        environment:
            MONGO_INITDB_ROOT_USERNAME: mongo
            MONGO_INITDB_ROOT_PASSWORD: mongo
            MONGO_INITDB_DATABASE: auth_db
        ports:
            - '27017:27017'
        volumes:
            - 'mongodb_data:/data/db'
        healthcheck:
            test:
                - CMD
                - mongosh
                - --eval
                - 'db.adminCommand("ping")'
            interval: 10s
            timeout: 5s
            retries: 5
    auth-service:
        build:
            context: ./auth-service
        container_name: students-auth-service
        environment:
            PORT: 3001
            MONGO_URI: mongodb://mongo:mongo@mongodb:27017/auth_db
            JWT_SECRET: your-secret-key-change-in-production
            NODE_ENV: production
        depends_on:
            mongodb:
                condition: service_healthy
        ports:
            - '3001:3001'
    frontend:
        build:
            context: ./frontend
        container_name: students-frontend
        environment:
            API_BASE_URL: http://api-gateway:8080
            NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        depends_on:
            api-gateway:
                condition: service_started
        ports:
            - '3000:3000'
volumes:
    postgres_data: null
    postgres16_data: null
    mongodb_data: null
