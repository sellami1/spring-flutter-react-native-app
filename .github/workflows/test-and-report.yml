name: Test and Report to Xray

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: "21"

jobs:
  test-and-xray:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests
        working-directory: rest-spring-api
        run: ./mvnw verify

      - name: Upload JUnit results to Xray
        if: always()
        env:
          XRAY_TOKEN: ${{ secrets.XRAY_TOKEN }}
          XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${XRAY_TOKEN:-}" ]]; then
            echo "XRAY_TOKEN is missing. Add it in GitHub Secrets."
            exit 1
          fi

          if [[ -z "${XRAY_PROJECT_KEY:-}" ]]; then
            echo "XRAY_PROJECT_KEY is missing. Add it in GitHub Secrets (example: PROJ)."
            exit 1
          fi

          shopt -s nullglob
          reports=(
            rest-spring-api/target/surefire-reports/TEST-*.xml
            rest-spring-api/target/failsafe-reports/TEST-*.xml
          )

          if [[ ${#reports[@]} -eq 0 ]]; then
            echo "No JUnit XML reports found to upload."
            exit 1
          fi

          for report in "${reports[@]}"; do
            echo "Uploading $report to Xray..."
            curl --fail --silent --show-error \
              -H "Content-Type: multipart/form-data" \
              -H "Authorization: Bearer ${XRAY_TOKEN}" \
              -F "file=@${report}" \
              "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=${XRAY_PROJECT_KEY}"
          done

          echo "Xray upload completed."
